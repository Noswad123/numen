[package]
name = "numen"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An event-driven desktop familiar for the Arcana ecosystem"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }
fontdue = "0.9.5"
image = { version = "=0.25.8", default-features = false, features = ["png"] }
libc = "0.2"
pixels = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.9"
core-graphics = "0.23.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
