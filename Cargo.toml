[package]
name = "numen"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An event-driven desktop familiar for the Arcana ecosystem"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
pixels = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30.13"

[profile.release]
lto = "thin"
strip = true
