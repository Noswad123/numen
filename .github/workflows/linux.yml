name: Linux

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --bin numen -- -D warnings
      - run: cargo run --locked -- check-assets
      # Actual Wayland/X11 presentation is opt-in; see tests/linux_desktop.rs.
